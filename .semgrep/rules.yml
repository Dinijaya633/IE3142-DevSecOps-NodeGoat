rules:
  - id: nosql-injection-where-interpolation
    languages: [javascript]
    severity: ERROR
    message: >
      User-controlled input is interpolated directly into a MongoDB $where
      clause. This allows NoSQL injection.
    patterns:
      - pattern-regex: "\\$where:.*'\\$\\{[^}]+\\}'"

  - id: idor-userid-from-params
    languages: [javascript]
    severity: ERROR
    message: >
      User ID is taken from req.params instead of the authenticated session.
      This may allow IDOR.
    patterns:
      - pattern-regex: "const\\s*\\{[^}]*userId[^}]*\\}\\s*=\\s*req\\.params"

  - id: ssrf-user-controlled-url
    languages: [javascript]
    severity: ERROR
    message: >
      A user-controlled URL is passed to an HTTP request.
      This may allow SSRF.
    patterns:
      - pattern-regex: "req\\.query\\.url\\s*\\+"

  - id: ssjs-eval-request-body
    languages: [javascript]
    severity: ERROR
    message: >
      User-controlled request input is passed to eval().
      This may allow Server-Side JavaScript Injection.
    patterns:
      - pattern-regex: 'eval\s*\(\s*req\.body\.[A-Za-z_$][A-Za-z0-9_$]*\s*\)'
